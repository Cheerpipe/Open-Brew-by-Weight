## IDF Component Manager Manifest File
## Pin exact Arduino-ESP32 release for reproducible builds (see dependencies.lock).
## Arduino's manifest resolves transitive components according to IDF version
## and target; selective compilation disables unused Arduino libraries.
## Keep dependencies.lock in version control for reproducible resolution.
dependencies:
  espressif/arduino-esp32:
    version: "==4.0.0"
  espressif/cjson:
    version: "^1.7.19"
  espressif/mdns:
    version: "==1.14.1"
  espressif/esp_websocket_client:
    version: "==1.8.0"
  ## arduino-esp32 declares Modbus, RainMaker, Insights and speech recognition
  ## as dependencies, but this firmware never uses them and selective
  ## compilation leaves their Arduino libraries out. The overrides satisfy
  ## Arduino's constraints with empty local stubs instead of compiling them
  ## and the components they pull in. RainMaker would also bring in
  ## network_provisioning, whose Kconfig makes Arduino's WiFi headers include
  ## headers that are not on Arduino's include path.
  espressif/esp-modbus:
    override_path: ../third_party/esp-modbus
  espressif/esp_rainmaker:
    override_path: ../third_party/esp_rainmaker
  espressif/esp_insights:
    override_path: ../third_party/esp_insights
  espressif/esp-sr:
    override_path: ../third_party/esp-sr
