## IDF Component Manager Manifest File
## Pin exact Arduino-ESP32 release for reproducible builds (see dependencies.lock).
## Arduino's manifest resolves transitive components according to IDF version
## and target; selective compilation disables unused Arduino libraries.
## Keep dependencies.lock in version control for reproducible resolution.
dependencies:
  espressif/arduino-esp32:
    version: "==3.3.12"
  espressif/cjson:
    version: "^1.7.19"
  espressif/mdns:
    version: "==1.14.1"
  espressif/esp_websocket_client:
    version: "==1.8.0"
  ## arduino-esp32 declares esp-modbus as a public dependency, but this
  ## firmware never uses Modbus. The override satisfies Arduino's ^2.1.3
  ## constraint with the empty local stub instead of compiling it in.
  espressif/esp-modbus:
    override_path: ../third_party/esp-modbus
