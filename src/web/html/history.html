<fieldset id="historyPanel">
  <legend>{{webui:history.activation_history}}</legend>
  <div class="panelWrap">
    <div id="historyStickySentinel" class="stickyBarSentinel" aria-hidden="true"></div>
    <div class="btnBar glassBar">
      <div
        id="historySort"
        class="shotSort"
        role="group"
        aria-label="{{webui:history.sort_history}}"
      >
        <span class="sortLbl">{{webui:runtime.sort}}</span
        ><button id="historyDirButton" type="button" aria-label="{{webui:runtime.oldest_first}}">
          {{webui:stats.date}} ↓
        </button>
      </div>
      <button
        id="historyFilterButton"
        class="btnGlyph"
        type="button"
        aria-haspopup="true"
        aria-expanded="false"
        title="{{webui:history.filter}}"
      >
        <span class="g" aria-hidden="true"
          ><svg aria-hidden="true"><use href="#hFl" /></svg></span
        ><span class="t">{{webui:history.filter}}</span
        ><span class="histFilterCount" hidden></span></button
      ><button
        id="exportHistoryButton"
        class="btnGlyph"
        title="{{webui:history.export_csv}}"
        type="button"
      >
        <span class="g" aria-hidden="true">↓</span
        ><span class="t">{{webui:history.export_csv}}</span></button
      ><button
        id="clearHistoryButton"
        class="btnGlyph btnInvert"
        title="{{webui:history.clear}}"
        type="button"
      >
        <span class="g" aria-hidden="true">×</span><span class="t">{{webui:history.clear}}</span>
      </button>
    </div>
    <p id="historyTableState" class="emptyState" role="status" hidden></p>
    <table id="historyTable">
      <thead>
        <tr>
          <th>{{webui:history.time}}</th>
          <th>{{webui:history.dur}}</th>
          <th>{{webui:history.type}}</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="historyRows"></tbody>
    </table>
    <div id="historySentinel" hidden></div>
  </div>
</fieldset>
